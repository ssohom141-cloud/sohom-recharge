<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Payment - Sohom Wallet</title>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.box { background:white; padding:20px; border-radius:12px; max-width:500px; margin:auto; }
.bill-type { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:15px 0; }
.type { padding:15px; border:2px solid #ddd; border-radius:10px; text-align:center; cursor:pointer; font-weight:bold; }
.type.active { border-color:#dc3545; background:#ffe6e9; }
input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
.btn { width:100%; padding:14px; background:#dc3545; color:white; border:none; border-radius:8px; font-size:16px; margin-top:15px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
    <h2>Bill Payment</h2>
    
    <h4>Select Bill Type</h4>
    <div class="bill-type">
        <div class="type active" onclick="selectBill(this,'Electricity')">💡 Electricity</div>
        <div class="type" onclick="selectBill(this,'Gas')">🔥 Gas</div>
        <div class="type" onclick="selectBill(this,'Water')">💧 Water</div>
        <div class="type" onclick="selectBill(this,'Broadband')">📶 Broadband</div>
        <div class="type" onclick="selectBill(this,'DTH')">📺 DTH</div>
        <div class="type" onclick="selectBill(this,'Landline')">☎️ Landline</div>
    </div>
    
    <input type="text" id="consumer" placeholder="Enter Consumer/Account Number">
    <input type="text" id="billAmount" placeholder="Enter Bill Amount ₹">
    
    <button class="btn" onclick="payBill()">Pay Bill ₹<span id="amountShow">0</span></button>
</div>

<script>
let billType = "Electricity";

function selectBill(el, type) {
    document.querySelectorAll('.type').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    billType = type;
}

document.getElementById('billAmount').addEventListener('input', function(){
    document.getElementById('amountShow').innerText = this.value || 0;
})

function payBill() {
    let consumer = document.getElementById('consumer').value;
    let billAmount = document.getElementById('billAmount').value;
    if(consumer == '' || billAmount == '') {
        alert("Sob field fill kor bos");
        return;
    }
    if(isNaN(billAmount)) {
        alert("Thik amount bosha");
        return;
    }
    let planDesc = `${billType} Bill Payment`;
    window.location.href = `payment.html?amount=${billAmount}&operator=${billType}&number=${consumer}&plan=${encodeURIComponent(planDesc)}`;
}
</script>
</body>
</html>
