<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Sohom Wallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0f1e; color: white; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .back { font-size: 28px; text-decoration: none; color: #00d4ff; margin-right: 15px; }
        h2 { color: #00d4ff; font-size: 22px; }
        .summary { background: #1a2333; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .summary p { margin: 8px 0; color: #aaa; }
        .summary h3 { color: #ffa500; font-size: 24px; margin-top: 10px; }
        .upi-option { background: #1a2333; padding: 16px; border-radius: 12px; margin: 12px 0; display: flex; align-items: center; cursor: pointer; border: 2px solid #2a3342; }
        .upi-option:active { border: 2px solid #00d4ff; }
        .upi-icon { font-size: 30px; margin-right: 15px; }
        .pay-btn { width: 100%; padding: 16px; background: #ffa500; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; margin-top: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <a href="recharge.html" class="back">←</a>
        <h2>Complete Payment</h2>
    </div>
    
    <div class="summary">
        <p>Mobile: <span id="number">98XXXXXX10</span></p>
        <p>Operator: <span id="operator">Jio</span></p>
        <p>Plan: <span id="plan">₹299 - 28 Days</span></p>
        <h3>Total: ₹<span id="amount">299</span></h3>
    </div>

    <h3>Pay with UPI</h3>

<div class="upi-option" onclick="payUPI()">
    <div class="upi-icon">📱</div>
    <div>
        <b>UPI ID</b><br>
        <span style="color:#aaa;">Enter your UPI ID</span>
    </div>
</div>

<div class="upi-option" onclick="payPhonePe()">
    <div class="upi-icon">🟣</div>
    <div><b>PhonePe</b></div>
</div>

<div class="upi-option" onclick="payGPay()">
    <div class="upi-icon">🔵</div>
    <div><b>Google Pay</b></div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    let amount = urlParams.get('amount');
    let operator = urlParams.get('operator');
    let plan = urlParams.get('plan');
    let number = urlParams.get('number');

    document.getElementById('amount').innerText = amount;
    document.getElementById('operator').innerText = operator;
    document.getElementById('plan').innerText = plan;
    document.getElementById('number').innerText = number;

    let upiID = "test@upi";

    function payUPI() {
        let url = `upi://pay?pa=${upiID}&pn=Sohom Wallet&am=${amount}&cu=INR&tn=Mobile Recharge`;
        window.location.href = url;
        setTimeout(() => {
            alert("Payment request sent! 🎉");
            window.location.href = "index.html";
        }, 3000);
    }
    function payPhonePe() { payUPI(); }
    function payGPay() { payUPI(); }
</script>
}
</script>
    <button class="pay-btn" onclick="upiPay()">Pay Now</button>

    <script>
</body>
                       </html>
