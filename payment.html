<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Sohom Wallet</title>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.box { background:white; padding:20px; border-radius:12px; max-width:500px; margin:auto; }
.summary { background:#f0f0f0; padding:15px; border-radius:8px; margin-bottom:20px; }
.upi-option { display:flex; align-items:center; padding:12px; border:1px solid #ddd; border-radius:8px; margin:10px 0; cursor:pointer; }
.upi-option:hover { background:#f9f9f9; }
.upi-icon { font-size:24px; margin-right:10px; }
.btn { width:100%; padding:14px; background:#28a745; color:white; border:none; border-radius:8px; font-size:16px; margin-top:15px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
    <h2>Complete Payment</h2>
    
    <div class="summary">
        <p><b>Mobile:</b> <span id="number"></span></p>
        <p><b>Operator:</b> <span id="operator"></span></p>
        <p><b>Plan:</b> <span id="plan"></span></p>
        <h3>Total: ₹<span id="amount"></span></h3>
    </div>
    
    <h4>Pay with UPI</h4>
    <div class="upi-option" onclick="payUPI()">
        <div class="upi-icon">📱</div>
        <div><b>UPI ID</b><br><small>Enter your UPI ID</small></div>
    </div>
    <div class="upi-option" onclick="payPhonePe()">
        <div class="upi-icon">🟣</div>
        <div><b>PhonePe</b></div>
    </div>
    <div class="upi-option" onclick="payGPay()">
        <div class="upi-icon">🔵</div>
        <div><b>Google Pay</b></div>
    </div>
    
    <button class="btn" onclick="payUPI()">Pay Now ₹<span id="amountBtn"></span></button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
let amount = urlParams.get('amount');
let operator = urlParams.get('operator');
let number = urlParams.get('number');
let plan = urlParams.get('plan');

document.getElementById('amount').innerText = amount;
document.getElementById('amountBtn').innerText = amount;
document.getElementById('operator').innerText = operator;
document.getElementById('number').innerText = number;
document.getElementById('plan').innerText = plan;

let upiID = "sohom@upi"; // EKHANE TOR ASOL UPI ID BOSHABI

function payUPI() {
    let name = "Sohom Wallet";
    let url = `upi://pay?pa=${upiID}&pn=${name}&am=${amount}&cu=INR&tn=${plan}`;
    window.location.href = url;
    setTimeout(() => {
        alert("Payment Successful! 🎉\nRecharge hobe 2 min er modhye");
        window.location.href = "index.html";
    }, 3000);
}
function payPhonePe() { payUPI(); }
function payGPay() { payUPI(); }
</script>
</body>
</html>
