<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohom Wallet - Recharge & Bill Pay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0f1e; color: white; text-align: center; padding: 30px 20px; min-height: 100vh; }
        .logo { font-size: 28px; font-weight: bold; color: #00d4ff; margin-bottom: 30px; letter-spacing: 1px; }
        h1 { font-size: 28px; margin-bottom: 10px; line-height: 1.4; }
        h1 span { color: #00d4ff; }
        p { color: #aaa; margin-bottom: 30px; line-height: 1.6; max-width: 400px; margin-left: auto; margin-right: auto; }
        .stats { display: flex; justify-content: space-around; margin: 40px 0; }
        .stat h3 { font-size: 24px; color: #00d4ff; }
        .stat p { font-size: 12px; margin: 5px 0 0 0; color: #888; }
        .btn { display: inline-block; width: 90%; max-width: 350px; padding: 16px 30px; background: #ffa500; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; text-decoration: none; margin: 10px; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); }
        .btn-secondary { background: #00d4ff; color: #0a0f1e; }
    </style>
</head>
<body>
    <div class="logo">SOHOM WALLET</div>
    <h1>Every recharge, every bill, <br> one <span>Sohom Wallet</span></h1>
    <p>Top up prepaid plans, pay electricity and LPG bills, renew Fastag - all in one screen.</p>
    <a href="recharge.html" class="btn">Recharge Now →</a>
    <a href="paybill.html" class="btn btn-secondary">Pay a Bill</a>
    <div class="stats">
        <div class="stat"><h3>18</h3><p>Services live</p></div>
        <div class="stat"><h3><30s</h3><p>Avg. settlement</p></div>
        <div class="stat"><h3>256-bit</h3><p>Encrypted</p></div>
    </div>
</body>
</html>
