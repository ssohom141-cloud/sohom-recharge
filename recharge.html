<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge - Sohom Wallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0f1e; color: white; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .back { font-size: 28px; text-decoration: none; color: #00d4ff; margin-right: 15px; }
        h2 { color: #00d4ff; font-size: 22px; }
        input { width: 100%; padding: 16px; margin: 15px 0; background: #1a2333; border: 1px solid #2a3342; border-radius: 12px; color: white; font-size: 16px; }
        .operators { display: flex; justify-content: space-between; margin: 20px 0; }
        .op { padding: 12px 18px; background: #1a2333; border-radius: 12px; cursor: pointer; border: 2px solid #2a3342; font-weight: bold; transition: 0.2s; }
        .op.active { background: #00d4ff; color: black; border: 2px solid #00d4ff; }
        h3 { margin: 20px 0 10px 0; }
        .plans { background: #1a2333; padding: 16px; border-radius: 12px; margin: 12px 0; cursor: pointer; border: 2px solid #2a3342; transition: 0.2s; }
        .plans.active { border: 2px solid #ffa500; background: #2a1f0a; }
        .pay-btn { width: 100%; padding: 16px; background: #ffa500; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; margin-top: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back">←</a>
        <h2>Mobile Recharge</h2>
    </div>
    <input type="tel" placeholder="Enter Mobile Number" maxlength="10">
    <div class="operators">
        <div class="op" onclick="selectOp(this)">Jio</div> 
        <div class="op" onclick="selectOp(this)">Airtel</div> 
        <div class="op" onclick="selectOp(this)">Vi</div> 
        <div class="op" onclick="selectOp(this)">BSNL</div>
    </div>
    <h3>Popular Plans</h3>
    <div class="plans" onclick="selectPlan(this, 299)">₹299 - 28 Days - 2GB/Day + 100 SMS</div>
    <div class="plans" onclick="selectPlan(this, 499)">₹499 - 84 Days - 3GB/Day + 100 SMS</div>
    <button class="pay-btn" id="payBtn" onclick="goToPayment()">Proceed to Pay ₹299</button>

    <script>
        function selectOp(el) {
        let globalAmount = 299; // default
let globalOperator = "Jio";

function selectOperator(el, op) {
    document.querySelectorAll('.op').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    globalOperator = op;
}

function selectPlan(el, price) {
    document.querySelectorAll('.plans').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    globalAmount = price;
    document.getElementById('payBtn').innerText = `Proceed to Pay ₹${price}`;
}

function goToPayment() {
    let number = document.getElementById('number').value;
    if(number.length < 10) {
        alert("10 digit number dao bos");
        return;
    }
    let planText = document.querySelector('.plans.active').innerText;
    window.location.href = `payment.html?amount=${globalAmount}&operator=${globalOperator}&plan=${planText}&number=${number}`;
}
    </script>
</body>
</html>
