<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge - Sohom Wallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0a0f1e; color: white; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back { font-size: 24px; text-decoration: none; color: #00d4ff; margin-right: 15px; }
        h2 { color: #00d4ff; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1a2333; border: 1px solid #333; border-radius: 8px; color: white; font-size: 16px; }
        .operators { display: flex; justify-content: space-around; margin: 20px 0; }
        .op { padding: 10px; background: #1a2333; border-radius: 10px; }
        .plans { background: #1a2333; padding: 15px; border-radius: 10px; margin: 10px 0; }
        .pay-btn { width: 100%; padding: 15px; background: #ffa500; color: black; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back">←</a>
        <h2>Mobile Recharge</h2>
    </div>
    <input type="tel" placeholder="Enter Mobile Number">
    <div class="operators">
        <div class="op">Jio</div> <div class="op">Airtel</div> <div class="op">Vi</div> <div class="op">BSNL</div>
    </div>
    <h3>Popular Plans</h3>
    <div class="plans">₹299 - 28 Days - 2GB/Day</div>
    <div class="plans">₹499 - 84 Days - 3GB/Day</div>
    <button class="pay-btn">Proceed to Pay ₹299</button>
</body>
</html>
