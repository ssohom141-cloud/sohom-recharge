<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recharge - Sohom Wallet</title>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.box { background:white; padding:20px; border-radius:12px; max-width:500px; margin:auto; }
input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
.operator, .plan { display:inline-block; padding:10px 15px; margin:5px; border:2px solid #ddd; border-radius:8px; cursor:pointer; }
.operator.active, .plan.active { border-color:#007bff; background:#e7f1ff; }
.btn { width:100%; padding:14px; background:#007bff; color:white; border:none; border-radius:8px; font-size:16px; margin-top:15px; cursor:pointer; }
.btn-outline { background:white; color:#007bff; border:2px solid #007bff; }
.plan-list { max-height:300px; overflow-y:auto; margin-top:10px; }
.plan-item { border:1px solid #eee; padding:10px; border-radius:8px; margin-bottom:8px; cursor:pointer; }
.plan-item:hover { background:#f9f9f9; }
</style>
</head>
<body>
<div class="box">
    <h2>Mobile Recharge</h2>
    <input type="number" id="number" placeholder="Enter 10 digit Mobile Number">
    
    <h4>Select Operator</h4>
    <div class="operator active" onclick="selectOperator(this,'Jio')">Jio</div>
    <div class="operator" onclick="selectOperator(this,'Airtel')">Airtel</div>
    <div class="operator" onclick="selectOperator(this,'Vi')">Vi</div>
    <div class="operator" onclick="selectOperator(this,'BSNL')">BSNL</div>
    
    <h4>Popular Plans</h4>
    <div class="plan active" onclick="selectPlan(this,299,'₹299 - 28 Days, 1.5GB/Day')">₹299</div>
    <div class="plan" onclick="selectPlan(this,499,'₹499 - 84 Days, 1.5GB/Day')">₹499</div>
    <div class="plan" onclick="selectPlan(this,999,'₹999 - 365 Days, 2GB/Day')">₹999</div>
    <button class="btn btn-outline" onclick="viewAllPlans()">View All Plans</button>
    
    <div id="allPlans" class="plan-list" style="display:none;"></div>
    
    <button class="btn" id="payBtn" onclick="goToPayment()">Proceed to Pay ₹299</button>
</div>

<script>
let amount = 299;
let operator = "Jio";
let planDesc = "₹299 - 28 Days, 1.5GB/Day";

const allPlans = [
    {price: 19, desc: "₹19 - 1 Day, 1GB"},
    {price: 149, desc: "₹149 - 20 Days, 1GB Total"},
    {price: 299, desc: "₹299 - 28 Days, 1.5GB/Day"},
    {price: 399, desc: "₹399 - 56 Days, 1GB/Day"},
    {price: 499, desc: "₹499 - 84 Days, 1.5GB/Day"},
    {price: 749, desc: "₹749 - 90 Days, 2GB/Day"},
    {price: 999, desc: "₹999 - 365 Days, 2GB/Day"},
];

function selectOperator(el, op) {
    document.querySelectorAll('.operator').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    operator = op;
}

function selectPlan(el, price, desc) {
    document.querySelectorAll('.plan').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    amount = price;
    planDesc = desc;
    document.getElementById('payBtn').innerText = `Proceed to Pay ₹${price}`;
}

function viewAllPlans() {
    let list = document.getElementById('allPlans');
    if(list.style.display == 'none') {
        list.innerHTML = allPlans.map(p => 
            `<div class="plan-item" onclick="selectPlan(this,${p.price},'${p.desc}')">${p.desc}</div>`
        ).join('');
        list.style.display = 'block';
    } else {
        list.style.display = 'none';
    }
}

function goToPayment() {
    let number = document.getElementById('number').value;
    if(number.length != 10) {
        alert("10 digit number dao bos");
        return;
    }
    window.location.href = `payment.html?amount=${amount}&operator=${operator}&number=${number}&plan=${encodeURIComponent(planDesc)}`;
}
</script>
</body>
</html>
